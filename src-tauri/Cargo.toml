[package]
name = "glafira-kubernetes"
version = "0.1.0"
description = "Glafira for Kubernetes — desktop-клиент для Kubernetes, OpenShift и Platform V DropApp"
authors = ["Glafira for Kubernetes contributors"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/vvnovg/glafira-kubernetes"

[lib]
# Суффикс _lib нужен, чтобы имя библиотеки не совпало с именем бинаря (Windows, cargo#8519).
name = "glafira_kubernetes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
plist = "1"
pem = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "ring", "http-proxy"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
http = "1"
secrecy = "0.10"
base64 = "0.22"
regex = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "io-std", "sync", "process"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
getrandom = "0.4"
dirs = "7"
sys-locale = "0.3"
glafira-mcp-core = { path = "../crates/glafira-mcp-core" }
glafira-mcp-kubernetes = { path = "../crates/glafira-mcp-kubernetes" }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tower-test = "0.4"
http-body-util = "0.1"
rmcp = { version = "3.5.1", features = ["client", "transport-async-rw"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
