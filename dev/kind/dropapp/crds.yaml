spec:
  group: config.dropapp.ru
  scope: Cluster
  names: { plural: clustermetadatas, singular: clustermetadata, kind: ClusterMetadata }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      schema:
        openAPIV3Schema: { type: object, x-kubernetes-preserve-unknown-fields: true }
